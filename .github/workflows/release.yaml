name: Create Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

jobs:
  create-release-and-build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Create release tag
        id: tag_version
        shell: bash
        run: |
          set -euo pipefail
          NEW_TAG=$(tr -d '\r\n' < VERSION)
          [[ "$NEW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "NEW_TAG=$NEW_TAG" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag_version.outputs.NEW_TAG }}
          RELEASE_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$RELEASE_BODY" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image with tag
        run: |
          TAG=${{ steps.tag_version.outputs.NEW_TAG }}
          docker build -t naotokubota/shiba2sashimi:$TAG -t naotokubota/shiba2sashimi:latest -f docker/Dockerfile .
          docker push naotokubota/shiba2sashimi:$TAG
          docker push naotokubota/shiba2sashimi:latest
